<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GigRide</title><style>body{font-family:sans-serif;background:#07101f;color:#fff;padding:20px}button,input{font-size:18px;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}.card{background:#101d31;padding:16px;border-radius:14px;margin:12px 0}.ok{color:#54d98c}.warn{color:#ffd166}</style></head><body><h1>GigRide</h1><p class="ok">Native Android foundation</p><div class="card"><h2>Shift</h2><button onclick="shift=!shift;render()" id="shift">Start shift</button><div id="status">Offline</div></div><div class="card"><h2>Quick transaction</h2><input id="cmd" placeholder="Ola 350 / Petrol 500 / Toll 80"><button onclick="add()">Add transaction</button><div id="last"></div></div><div class="card"><h2>CFO Sync</h2><div id="pending">Pending: 0</div><button onclick="syncPending()">Send pending to CFO</button><div id="syncStatus" class="warn"></div><p>Transactions remain queued until CFO accepts or rejects them. Failed handoffs and review items stay available for retry.</p></div><script src="gigride-cfo-core.js"></script><script>let shift=false;function render(){document.getElementById('shift').textContent=shift?'Stop shift':'Start shift';document.getElementById('status').textContent=shift?'Online':'Offline';refreshPending()}function refreshPending(){document.getElementById('pending').textContent='Pending: '+GigRideCfoCore.getPendingSync().length}function add(){const c=document.getElementById('cmd');try{const p=GigRideCfoCore.parseVoiceCommand(c.value);if(p.requiresConfirmation){document.getElementById('last').textContent='Confirmation required';return}const tx=GigRideCfoCore.createTransaction(p,{captureMethod:'keyboard'});const r=GigRideCfoCore.commitTransaction(tx);document.getElementById('last').textContent=r.saved?'Saved '+tx.transactionId:'Not saved';refreshPending();c.value=''}catch(e){document.getElementById('last').textContent=e.message}}function syncPending(){const list=GigRideCfoCore.getPendingSync();if(!list.length){document.getElementById('syncStatus').textContent='Nothing waiting to sync.';return}let sent=0;for(const tx of list){try{const ok=window.CfoBridge&&CfoBridge.sendTransaction(JSON.stringify(tx));if(ok){GigRideCfoCore.acknowledge(tx.transactionId,'sent');sent++}}catch(e){}}document.getElementById('syncStatus').textContent=sent?('Sent '+sent+' transaction(s) to CFO. Awaiting acceptance.'):'CFO unavailable. Transactions remain queued.';refreshPending()}window.handleCfoResult=function(transactionId,status){try{const updated=GigRideCfoCore.acknowledge(transactionId,status);document.getElementById('syncStatus').textContent=updated?('CFO '+status.replace('_',' ')+' '+transactionId):'CFO result received for unknown transaction';refreshPending()}catch(e){document.getElementById('syncStatus').textContent='Invalid CFO acknowledgment ignored.'}};render();</script></body></html>
