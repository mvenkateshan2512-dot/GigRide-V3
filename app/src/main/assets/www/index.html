<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GigRide</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07101f;color:#fff;padding:20px;max-width:720px;margin:auto}.muted{color:#9fb0c8}.card{background:#101d31;padding:18px;border-radius:16px;margin:14px 0}.metric{font-size:42px;font-weight:750}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:14px}.value{font-size:22px;font-weight:700}button{font:inherit;font-weight:700;padding:15px;width:100%;border:0;border-radius:12px;margin-top:10px}.primary{background:#fff;color:#07101f}.secondary{background:#263750;color:#fff}.ok{color:#54d98c}.warn{color:#ffd166}hr{border:0;border-top:1px solid #263750;margin:16px 0}.trip{padding:10px 0;border-bottom:1px solid #263750}
</style>
</head>
<body>
<h1>GigRide</h1><div class="ok">Odometer & trip tracker</div>
<div class="card"><div class="muted">ODOMETER</div><div class="metric"><span id="odometer">0.0</span> km</div><div class="small muted">Cumulative distance is retained on this device.</div></div>
<div class="card"><div class="muted">CURRENT TRIP</div><div class="metric"><span id="tripKm">0.0</span> km</div><div class="row"><div><div class="muted small">Duration</div><div class="value" id="duration">00:00:00</div></div><div><div class="muted small">GPS</div><div class="value" id="gps">Ready</div></div></div><button class="primary" id="tripButton" onclick="toggleTrip()">START TRIP</button><button class="secondary" id="resetButton" onclick="resetTrip()">RESET CURRENT TRIP</button><div class="warn small" id="message"></div></div>
<div class="card"><h2>Distance summary</h2><div class="row"><div><div class="muted small">Today</div><div class="value"><span id="today">0.0</span> km</div></div><div><div class="muted small">This month</div><div class="value"><span id="month">0.0</span> km</div></div></div></div>
<div class="card"><h2>Recent trips</h2><div id="history" class="muted">No completed trips yet.</div></div>
<script>
const KEY='gigride.odometer.v1';let state=load();let watchId=null,timer=null,lastPos=null;
function blank(){return{odometer:0,active:false,tripKm:0,startedAt:null,history:[]}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function fmtTime(ms){let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60);s%=60;return[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}
function distance(a,b){const R=6371e3,p=Math.PI/180,dLat=(b.latitude-a.latitude)*p,dLon=(b.longitude-a.longitude)*p,x=Math.sin(dLat/2)**2+Math.cos(a.latitude*p)*Math.cos(b.latitude*p)*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function render(){document.getElementById('odometer').textContent=state.odometer.toFixed(1);document.getElementById('tripKm').textContent=state.tripKm.toFixed(2);document.getElementById('tripButton').textContent=state.active?'STOP & SAVE TRIP':'START TRIP';document.getElementById('duration').textContent=state.startedAt?fmtTime(Date.now()-state.startedAt):'00:00:00';const now=new Date(),day=now.toISOString().slice(0,10),mon=day.slice(0,7);let td=0,md=0;state.history.forEach(t=>{if(t.date.startsWith(day))td+=t.km;if(t.date.startsWith(mon))md+=t.km});document.getElementById('today').textContent=td.toFixed(1);document.getElementById('month').textContent=md.toFixed(1);const h=document.getElementById('history');h.innerHTML=state.history.length?state.history.slice(-10).reverse().map(t=>'<div class="trip"><b>'+t.km.toFixed(2)+' km</b><br><span class="small muted">'+new Date(t.date).toLocaleString()+' · '+fmtTime(t.durationMs)+'</span></div>').join(''):'No completed trips yet.'}
function startGps(){if(!navigator.geolocation){msg('GPS is unavailable on this device.');return}document.getElementById('gps').textContent='Locating';watchId=navigator.geolocation.watchPosition(p=>{document.getElementById('gps').textContent='Tracking';const c=p.coords;if(c.accuracy>60)return;if(lastPos){const m=distance(lastPos,c);if(m>=2&&m<1000){const km=m/1000;state.tripKm+=km;state.odometer+=km;save();render()}}lastPos={latitude:c.latitude,longitude:c.longitude}},e=>{document.getElementById('gps').textContent='GPS issue';msg(e.message||'Location permission required.')},{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}
function stopGps(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;lastPos=null;document.getElementById('gps').textContent='Ready'}
function toggleTrip(){if(!state.active){state.active=true;state.tripKm=0;state.startedAt=Date.now();save();startGps();timer=setInterval(render,1000);msg('Trip tracking started.')}else{const ended=Date.now();stopGps();clearInterval(timer);if(state.tripKm>0)state.history.push({date:new Date(ended).toISOString(),km:state.tripKm,durationMs:ended-state.startedAt});state.active=false;state.tripKm=0;state.startedAt=null;save();msg('Trip saved.');render()}}
function resetTrip(){if(state.active){msg('Stop the active trip before resetting.');return}state.tripKm=0;state.startedAt=null;save();render();msg('Current trip reset. Odometer unchanged.')}
function msg(x){document.getElementById('message').textContent=x}
if(state.active){state.active=false;state.tripKm=0;state.startedAt=null;save();msg('Previous interrupted trip was safely closed. Start a new trip.')}render();
</script>
</body>
</html>
