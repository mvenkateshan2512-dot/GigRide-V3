<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GigRide</title><style>body{font-family:sans-serif;background:#07101f;color:#fff;padding:20px}button,input{font-size:18px;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}.card{background:#101d31;padding:16px;border-radius:14px;margin:12px 0}.ok{color:#54d98c}</style></head><body><h1>GigRide</h1><p class="ok">Native Android foundation</p><div class="card"><h2>Shift</h2><button onclick="shift=!shift;render()" id="shift">Start shift</button><div id="status">Offline</div></div><div class="card"><h2>Quick transaction</h2><input id="cmd" placeholder="Ola 350 / Petrol 500 / Toll 80"><button onclick="add()">Add transaction</button><div id="last"></div></div><div class="card"><h2>CFO Sync</h2><div id="pending">Pending: 0</div><p>Transactions are queued for verified CFO handoff.</p></div><script src="gigride-cfo-core.js"></script><script>let shift=false;function render(){document.getElementById('shift').textContent=shift?'Stop shift':'Start shift';document.getElementById('status').textContent=shift?'Online':'Offline'}function add(){const c=document.getElementById('cmd');try{const p=GigRideCfoCore.parseVoiceCommand(c.value);if(p.requiresConfirmation){document.getElementById('last').textContent='Confirmation required';return}const tx=GigRideCfoCore.createTransaction(p,{captureMethod:'keyboard'});const r=GigRideCfoCore.commitTransaction(tx);document.getElementById('last').textContent=r.saved?'Saved '+tx.transactionId:'Not saved';document.getElementById('pending').textContent='Pending: '+GigRideCfoCore.getPendingSync().length;c.value=''}catch(e){document.getElementById('last').textContent=e.message}}</script></body></html>
