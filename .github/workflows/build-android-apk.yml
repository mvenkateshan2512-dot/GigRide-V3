name: Build GigRide Android APK

on:
  push:
    branches:
      - main
      - feature/gigride-v1-native-android
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > GigRide-v1.0.0-debug.apk.sha256
          cp app/build/outputs/apk/debug/app-debug.apk GigRide-v1.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GigRide-Android-v1.0.0
          path: |
            GigRide-v1.0.0-debug.apk
            GigRide-v1.0.0-debug.apk.sha256
          if-no-files-found: error
